name: refresh

on:
  schedule:
    - cron: "23 21 * * *"   # daily, 02:53 IST, off-peak minute
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/profile.yml
      - data/projects.yml
      - data/config.yml
      - "templates/**"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install
        run: pip install pyyaml==6.0.3 fonttools==4.63.0

      - name: Fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_READ_TOKEN: ${{ secrets.PROFILE_READ_TOKEN }}   # optional; empty when not set
        run: python scripts/fetch.py

      - name: Build
        run: python scripts/build.py

      - name: Check
        run: python scripts/check.py

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(profile): refresh data"
          git push
