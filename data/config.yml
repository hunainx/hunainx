# Build configuration. Content lives in data/profile.yml; this file is layout + rules.

login: hunainx

# Section visibility thresholds (PRD §6). A section below its threshold is omitted.
thresholds:
  stats_min_public_repos: 1        # eligible public repos (non-fork, non-archived, not the profile repo)

# Shipping signal: each count is shown only at or above its threshold, and only when the API
# returned it. Nothing below a threshold is replaced by another number. The contributions count
# gates the whole panel: below its threshold, the section is hidden.
signal:
  contributions_min: 50            # contributions in the last 12 months
  repos_contributed_min: 2         # repositories contributed to in the last 12 months
  public_repos_min: 1              # eligible public repos
  stars_min: 1                     # stars earned on eligible public repos

selected_work:
  max_cards: 4                     # auto-pick when profile.yml featured_repos is empty
  max_topics: 3

# Responsive tiers. Each <picture> lists the widest tier first (GitHub's themed-picture script
# keeps only the first source of the viewer's theme when they use an explicit theme).
# Measured README column: >= 1260px viewport: 826-846px; 1012-1259px: 578-826px; < 1012px: 308-685px.
tiers:
  desktop: { width: 840, min_viewport: 1260 }
  mid:     { width: 600, min_viewport: 1012 }
  mobile:  { width: 360 }
# Components that get the 600px mid tier (others use desktop art from 1012px). All full-width
# components share it so their edges line up at every width; work cards (410px) never scale.
mid_tier: [hero, motion, stack, signal, method, separator]

hero:
  agents_category: "AI toolkit"         # profile.yml stack category listed top-right; its signals feed BUILD
  corners:                              # true values only
    top_left: "MYSURU, IN"
    top_right: "UTC+5:30"
    bottom_left: "main"
    bottom_right: "hunainx/hunainx"

# Terminal label + native heading for each section.
sections:
  motion:     { command: "./in-motion",    heading: "In motion" }
  work:       { command: "ls ./work",      heading: "Selected work" }
  stack:      { command: "tree ./stack",   heading: "Stack & range" }
  signal:     { command: "./signal",       heading: "Shipping signal" }
  principles: { command: "cat ./method",   heading: "How I work" }

# Colour tokens (PRD §7). `faint` is decorative only: it fails 4.5:1 as text.
tokens:
  dark:
    bg: "#0D1117"
    surface: "#11161D"
    line: "#1F2630"
    line_strong: "#2D3542"
    text: "#E6EDF3"
    muted: "#8B96A5"
    faint: "#4A5361"
    success: "#3FB950"   # "Live" status light (not used for text)
  light:
    bg: "#FFFFFF"
    surface: "#F6F8FA"
    line: "#D8DEE4"
    line_strong: "#C4CCD5"
    text: "#1F2328"
    muted: "#59636E"
    faint: "#8C959F"
    success: "#1A7F37"

# primary/secondary are used for fills and strokes; *_text for any glyphs drawn in the accent.
# Light ember primary #B5611C is 4.48:1 on white, so its text variant is darkened to pass 4.5:1.
accents:
  ember:
    dark:  { primary: "#F2A65A", secondary: "#7AA2F7", primary_text: "#F2A65A" }
    light: { primary: "#B5611C", secondary: "#3E63DD", primary_text: "#AA5B1A" }
  signal:
    dark:  { primary: "#4ADE80", secondary: "#F2A65A", primary_text: "#4ADE80" }
    light: { primary: "#15803D", secondary: "#B5611C", primary_text: "#15803D" }
  ion:
    dark:  { primary: "#5CC8FF", secondary: "#F2A65A", primary_text: "#5CC8FF" }
    light: { primary: "#0B6FA4", secondary: "#B5611C", primary_text: "#0B6FA4" }

# Size and motion budgets (REDESIGN §5), bytes / element counts.
budgets:
  svg_max: 61440
  hero_max: 92160
  assets_total_max: 716800
  max_animated_elements: 40

# Fixed labels used next to API numbers and in system-style captions.
labels:
  public_repos: "Public repos"
  stars: "Stars earned"
  contributions: "Contributions (12 mo)"
  repos_contributed: "Repositories contributed to (12 mo)"
  signal_header: "SHIPPING SIGNAL"
  signal_public: "public GitHub data"
  signal_token: "GitHub data, read-only token"
  stack_left: "DEPTH"
  stack_right: "RANGE"
  footer: "last refresh"
