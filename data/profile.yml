# Profile content. Edit and push; the workflow rebuilds the README.
# Empty fields are omitted from the profile.

name: "Hunain Ahmed"

# Hero subtitle (rendered uppercase).
role: "AI-native systems builder"

positioning: "I turn ambiguous problems into specified, architected, audited software, with AI agents doing the building."

focus: ["Evidence & document intelligence", "AI-agent systems", "Product architecture", "Web products"]

tagline: "From ambiguous problem to verified system."

about: >-
  I turn ambiguous problems into structured, working systems.

  Most of my work happens before the first line of code: breaking the problem
  down, researching the domain, and stress-testing whether the idea should be
  built at all. What survives becomes a precise specification and an
  architecture. AI coding agents carry the implementation under close
  direction, and everything they produce is audited adversarially before it
  ships.

  Right now that means evidence-intelligence infrastructure: pipelines that turn
  large, unstructured archives of documents, email, attachments and voice
  recordings into searchable evidence through OCR, transcription and vector
  retrieval, exposed to AI through MCP servers on Google Cloud. Alongside it are
  production web products, product concepts taken through adversarial
  validation, and the brand and creative systems around them.

  The domains change. The method doesn't.

# "Currently building" cards, in order. Details per card live in data/projects.yml.
now:
  - "Evidence intelligence platform: ingestion, OCR, transcription and vector retrieval for litigation-scale document archives, served to Claude through per-case MCP servers on Cloud Run"
  - "Airo Rentals booking platform: live availability, scheduling and an admin console on Supabase"
  - "Adversarial audit practice: report-only reviews of AI-built codebases, every finding ranked P0 to P3"
  - "This profile: a spec-first, truth-gated, self-updating build. The method, in public."

# "How I work": the 8-stage method. Rendered as an animated diagram AND as Markdown text.
method:
  - { stage: "Frame",         line: "Break the problem down until the real one is visible." }
  - { stage: "Research",      line: "Learn the domain before designing for it." }
  - { stage: "Challenge",     line: "Should this exist? Where does the idea fail? What is the smallest version that proves it?" }
  - { stage: "Specify",       line: "Write the product down precisely enough that an agent can't misread it." }
  - { stage: "Architect",     line: "Data model, infrastructure and boundaries decided before code." }
  - { stage: "Orchestrate",   line: "AI agents as the build team: scoped, parallel, supervised." }
  - { stage: "Audit",         line: "Read the output as an adversary. Severity-ranked, checked against the spec, never taken on trust." }
  - { stage: "Ship & iterate", line: "Deploy, observe, and feed what breaks back into the spec." }

# Closing line under the method, and the hero ticker source.
principles:
  - "Evidence over assertion. If a claim cannot be verified, it does not ship."

