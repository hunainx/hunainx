role: "AI · Software · Products"

# Hero tagline.
tagline: "Turning ambiguous problems into products, intelligent systems and working software."

# Hero depth line: small mono line under the tagline. The technical proof beneath the range.
depth: ["MCP", "Cloud Run", "PostgreSQL + pgvector", "Supabase", "Retrieval", "Interactive web", "Automation"]

positioning: "I turn ambiguous problems into products, intelligent systems and working software."

about: >-
  I take ambiguous problems and turn them into structured ideas, products and
  working systems.

  I think before I build. I research the domain, challenge the original idea,
  and define what the product should actually be. Then I design the
  architecture, specify it precisely, and lead the implementation. AI agents
  accelerate the build. I set the direction, review everything they produce,
  audit it adversarially, and make the final engineering and product calls.

  That method travels. This year it has taken me from evidence-intelligence
  infrastructure for legal investigations, with OCR, transcription and vector
  retrieval over PostgreSQL and pgvector served to AI through MCP on Google
  Cloud, to interactive websites for businesses, a booking platform, a hardware
  product concept taken through adversarial validation, and the automation and
  creative systems in between.

  The domains change. The method doesn't.

# Secondary line, rendered small and muted directly under About. No employer, no system name.
current: "Currently an AI Specialist, building evidence-intelligence infrastructure."

# "In motion" cards, in order. Details per card live in data/projects.yml.
now:
  - "Evidence intelligence platform: Ingestion, OCR, transcription and vector retrieval for litigation-scale document archives, served to AI through MCP servers on Cloud Run"
  - "Airo Rentals booking platform: Live availability, scheduling and an admin console, built on the self-drive rental site"
  - "Rumer Groups: Corporate website, specified in a 25,000-word PRD, built with AI-accelerated implementation and audited P0 to P3 before launch"
  - "AURA — A hardware product concept taken through adversarial validation covering market, feasibility, regulation and the smallest viable version"

# "How I work": the 8-stage method. Rendered as an animated diagram AND as Markdown text.
method:
  - { stage: "Frame",          line: "Break the problem down until the real one is visible." }
  - { stage: "Research",       line: "Learn the domain before designing for it." }
  - { stage: "Challenge",      line: "Should this exist? Where does the idea fail? What is the smallest version that proves it?" }
  - { stage: "Specify",        line: "Write the product down precisely enough that nothing is left to interpretation." }
  - { stage: "Architect",      line: "Data model, infrastructure and boundaries decided before code." }
  - { stage: "Orchestrate",    line: "Direct AI agents as a force multiplier: scoped, parallel, and reviewed before anything is accepted." }
  - { stage: "Audit",          line: "Read the output as an adversary. Severity-ranked, checked against the spec, never taken on trust." }
  - { stage: "Ship & iterate", line: "Deploy, observe, and feed what breaks back into the spec." }

# Closing line under the method, and the hero ticker source.
principles:
  - "Evidence over assertion. If a claim cannot be verified, it does not ship."

# Proof line under the method, linking to this repository.
