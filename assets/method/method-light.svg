<svg xmlns="http://www.w3.org/2000/svg" width="840" height="128" viewBox="0 0 840 128" role="img" aria-labelledby="t d">
<title id="t">How I work</title>
<desc id="d">Method: Frame: Break the problem down until the real one is visible. Research: Learn the domain before designing for it. Challenge: Should this exist? Where does the idea fail? What is the smallest version that proves it? Specify: Write the product down precisely enough that an agent can&#x27;t misread it. Architect: Data model, infrastructure and boundaries decided before code. Orchestrate: AI agents as the build team: scoped, parallel, supervised. Audit: Read the output as an adversary. Severity-ranked, checked against the spec, never taken on trust. Ship &amp; iterate: Deploy, observe, and feed what breaks back into the spec. Loop: Ship &amp; iterate back to Specify.</desc>
<style>text{font-family:-apple-system, "Segoe UI", Helvetica, Arial, sans-serif}.mo{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}.flw{animation:march 1.9s linear infinite}.rp{offset-path:path('M782.4 46C782.4 8 368.2 8 368.2 46');offset-rotate:auto;opacity:0;animation:ret 11.3s cubic-bezier(.5,0,.5,1) 10.40s infinite}.sig{offset-path:path('M57.6 58L161.1 58L264.7 58L368.2 58L471.8 58L575.3 58L678.9 58L782.4 58');animation:sigm 11.3s linear infinite}.h0{transform-origin:57.6px 58px;opacity:0;animation:lit 11.3s ease-out 0.00s infinite}.h1{transform-origin:161.1px 58px;opacity:0;animation:lit 11.3s ease-out 1.45s infinite}.h2{transform-origin:264.7px 58px;opacity:0;animation:lit 11.3s ease-out 2.91s infinite}.h3{transform-origin:368.2px 58px;opacity:0;animation:lit 11.3s ease-out 4.36s infinite}.h4{transform-origin:471.8px 58px;opacity:0;animation:lit 11.3s ease-out 5.81s infinite}.h5{transform-origin:575.3px 58px;opacity:0;animation:lit 11.3s ease-out 7.26s infinite}.h6{transform-origin:678.9px 58px;opacity:0;animation:lit 11.3s ease-out 8.72s infinite}.h7{transform-origin:782.4px 58px;opacity:0;animation:lit 11.3s ease-out 10.17s infinite}.trk{fill:none;stroke:#C4CCD5}.flw{fill:none;stroke:#B5611C;stroke-opacity:.35;stroke-dasharray:2 7}.node{fill:#F6F8FA;stroke:#C4CCD5}.pip{fill:#59636E}.lit{fill:#B5611C;fill-opacity:.18;stroke:#B5611C;stroke-width:1.5}.sig{fill:#B5611C}.lbl{fill:#1F2328}.loop{fill:none;stroke:#3E63DD;stroke-opacity:.6;stroke-dasharray:3 4}.chev{fill:none;stroke:#3E63DD;stroke-width:1.2}.rp{fill:#3E63DD}@keyframes march{to{stroke-dashoffset:-16}}@keyframes ret{0%{offset-distance:0%;opacity:0}3%{opacity:1}18%{opacity:1}22%,100%{offset-distance:100%;opacity:0}}@keyframes sigm{0%{offset-distance:0%;opacity:0}2%{opacity:1}90%{offset-distance:100%;opacity:1}92%,100%{offset-distance:100%;opacity:0}}@keyframes lit{0%{opacity:1;transform:scale(1.35)}25%{opacity:.9;transform:scale(1)}60%,100%{opacity:0;transform:scale(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
