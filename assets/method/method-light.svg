circle class="lit h6" cx="678.9" cy="58" r="10"/><text class="lbl mo" x="678.9" y="88" text-anchor="middle" letter-spacing="1.2" font-size="12">AUDIT</text><circle class="node" cx="782.4" cy="58" r="10"/><circle class="pip" cx="782.4" cy="58" r="3"/><circle class="lit h7" cx="782.4" cy="58" r="10"/><text class="lbl mo" x="782.4" y="88" text-anchor="middle" letter-spacing="1.2" font-size="12">SHIP &amp;</text><text class="lbl mo" x="782.4" y="104" text-anchor="middle" letter-spacing="1.2" font-size="12">ITERATE</text>
