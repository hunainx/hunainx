<svg xmlns="http://www.w3.org/2000/svg" width="600" height="232" viewBox="0 0 600 232" role="img" aria-labelledby="t d">
<title id="t">How I work</title>
<desc id="d">Method: Frame: Break the problem down until the real one is visible. Research: Learn the domain before designing for it. Challenge: Should this exist? Where does the idea fail? What is the smallest version that proves it? Specify: Write the product down precisely enough that an agent can&#x27;t misread it. Architect: Data model, infrastructure and boundaries decided before code. Orchestrate: AI agents as the build team: scoped, parallel, supervised. Audit: Read the output as an adversary. Severity-ranked, checked against the spec, never taken on trust. Ship &amp; iterate: Deploy, observe, and feed what breaks back into the spec. Loop: Ship &amp; iterate back to Specify.</desc>
