 r="10"/><circle class="pip" cx="376.6" cy="162" r="3"/><circle class="lit h6" cx="376.6" cy="162" r="10"/><text class="lbl mo" x="376.6" y="192" text-anchor="middle" letter-spacing="1.2" font-size="12">AUDIT</text><circle class="node" cx="529.8" cy="162" r="10"/><circle class="pip" cx="529.8" cy="162" r="3"/><circle class="lit h7" cx="529.8" cy="162" r="10"/><text class="lbl mo" x="529.8" y="192" text-anchor="middle" letter-spacing="1.2" font-size="12">SHIP &amp; ITERATE</text>
