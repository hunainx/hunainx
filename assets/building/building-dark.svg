<title id="t">Currently building</title>
<desc id="d">01: Building a legal investigation platform: document ingestion, high-performance search and evidence analysis Private. Stack: Supabase, Postgres, Google Cloud Storage, Claude Code. 02: Engineering a booking platform: live availability, scheduling and an admin console Private. Stack: Supabase, Postgres. 03: Conducting adversarial audits of AI-built codebases before launch Private. Stack: Claude Code, Google Antigravity.</desc>
