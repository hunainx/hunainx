<desc id="d">01: Evidence intelligence platform: ingestion, OCR, transcription and vector retrieval for litigation-scale document archives, served to Claude through per-case MCP servers on Cloud Run Status: In active use. Private. Stack: Google Cloud Run, Google Cloud Storage, Supabase, Postgres, pgvector, MCP, Claude.</desc>
