<title id="t">Evidence intelligence platform</title>
<desc id="d">01. AI infrastructure. Evidence intelligence platform: Ingestion, OCR, transcription and vector retrieval for litigation-scale document archives, served to AI through MCP servers on Cloud Run · Status: In active use. Confidential. Stack: Google Cloud Run, Google Cloud Storage, Supabase, PostgreSQL, pgvector, MCP, Claude.</desc>
